name: Android Tests

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      # 只跑 app/src/test 底下的 local unit test（JVM 上執行），
      # 不跑 app/src/androidTest（那套需要模擬器，成本高很多，先不放進 CI）。
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
